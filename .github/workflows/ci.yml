name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar flake8
        run: pip install flake8

      - name: Lint (errores criticos)
        run: |
          flake8 app/ \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics
